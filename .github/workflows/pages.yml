name: Deploy OSSL report to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['reports/**', 'scripts/build_ossl_report.py', 'tests/test_ossl_report.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify saved-curve metrics and reproducibility
        run: |
          python3 -m unittest discover -s tests -p test_ossl_report.py
          python3 scripts/build_ossl_report.py
          git diff --exit-code -- reports/ossl-test-50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/ossl-test-50
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
